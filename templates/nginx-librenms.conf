server {

    listen 80;

    server_name _;

    root /opt/librenms/html;

    index index.php;

    charset utf-8;

    gzip on;
    gzip_types
        text/css
        application/javascript
        text/javascript
        image/svg+xml
        text/plain;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {

        include fastcgi.conf;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass unix:/run/php-fpm-librenms.sock;

    }

    location ~ /\.(?!well-known).* {

        deny all;

    }

}
